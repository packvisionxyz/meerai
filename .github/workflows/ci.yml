name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "site/**"
      - ".agents/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "site/**"
      - ".agents/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Format, Clippy, and Test
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release): bump version to ')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets

      - name: Check headless-only build
        run: cargo check -p meerai-cli --no-default-features

      - name: Check TUI without update check
        run: cargo check -p meerai-tui --no-default-features

      - name: Add Wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Check browser client for Wasm
        run: cargo check -p meerai-web-client --target wasm32-unknown-unknown

      - name: Run tests
        run: cargo test --workspace

  audit:
    name: Security & Dependency Audit
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release): bump version to ')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect a dependency change
        id: deps
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          changed=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed=false
            files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
              --paginate --jq '.[].filename')"
            if printf '%s\n' "$files" | grep -qxE 'Cargo\.(toml|lock)'; then
              changed=true
            fi
          fi
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "Dependency change: ${changed}"

      - name: Run cargo-deny audit
        if: steps.deps.outputs.changed == 'true'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features
