name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Format, Clippy, and Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets

      - name: Check headless-only build
        run: cargo check -p meerai-cli --no-default-features

      - name: Check TUI without update check
        run: cargo check -p meerai-tui --no-default-features

      - name: Add Wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Check browser client for Wasm
        run: cargo check -p meerai-web-client --target wasm32-unknown-unknown

      - name: Run tests
        run: cargo test --workspace

  audit:
    name: Security & Dependency Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run cargo-deny audit
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features
