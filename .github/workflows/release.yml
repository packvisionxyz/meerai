name: Release

run-name: ${{ (github.event_name == 'workflow_run' && 'Release from CI') || format('Release {0}', inputs.tag || github.ref_name) }}

on:
  push:
    tags:
      - "v*"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag name (e.g. v0.1.0)
        required: true
        type: string
      prerelease:
        description: Mark release as pre-release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: meerai

jobs:
  detect:
    name: Detect release
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve tag and check workspace version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          TAG_FROM_VERSION: ${{ github.event_name == 'workflow_run' && '1' || '' }}
        run: python3 .github/scripts/verify_release_version.py

      - name: Skip when the version is already released
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          skip=false
          if [ "${{ github.event_name }}" = "workflow_run" ] &&
             gh release view "${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "::notice::Release ${{ steps.meta.outputs.tag }} already exists; skipping."
            skip=true
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: detect
    if: needs.detect.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            archive: meerai-x86_64-unknown-linux-gnu.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: meerai-aarch64-unknown-linux-gnu.tar.gz
          - target: aarch64-apple-darwin
            os: macos-15
            archive: meerai-aarch64-apple-darwin.tar.gz
          - target: x86_64-apple-darwin
            os: macos-15
            archive: meerai-x86_64-apple-darwin.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: meerai-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          targets: ${{ matrix.target }}

      - name: Cache Cargo artifacts
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked -p meerai-cli --target "${{ matrix.target }}"

      - name: Sign macOS binary
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        shell: bash
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="${RUNNER_TEMP}/meerai-signing.keychain-db"
          CERT_PATH="${RUNNER_TEMP}/apple-cert.p12"
          KEYCHAIN_PASS="$(openssl rand -hex 24)"

          printf '%s' "${APPLE_CERTIFICATE}" | base64 --decode > "${CERT_PATH}"
          security create-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" -k "${KEYCHAIN_PATH}" -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" login.keychain-db

          IDENTITY="${APPLE_SIGNING_IDENTITY}"
          if [ -z "${IDENTITY}" ]; then
            IDENTITY="$(security find-identity -v -p codesigning "${KEYCHAIN_PATH}" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          fi
          if [ -z "${IDENTITY}" ]; then
            echo "::error::No Developer ID Application signing identity found in imported certificate"
            exit 1
          fi

          codesign --force --options runtime --timestamp --sign "${IDENTITY}" "target/${{ matrix.target }}/release/${BIN_NAME}"
          codesign --verify --verbose=2 "target/${{ matrix.target }}/release/${BIN_NAME}"
          rm -f "${CERT_PATH}"

      - name: Notarize macOS binary
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != ''
        shell: bash
        run: |
          set -euo pipefail
          NOTARIZE_ZIP="${RUNNER_TEMP}/${BIN_NAME}-notarize.zip"
          ditto -c -k --keepParent "target/${{ matrix.target }}/release/${BIN_NAME}" "${NOTARIZE_ZIP}"
          xcrun notarytool submit "${NOTARIZE_ZIP}" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_PASSWORD}" \
            --wait
          rm -f "${NOTARIZE_ZIP}"

      - name: Clean up macOS signing keychain
        if: always() && runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/apple-cert.p12" "${RUNNER_TEMP}/${BIN_NAME}-notarize.zip"
          if [ -f "${RUNNER_TEMP}/meerai-signing.keychain-db" ]; then
            security delete-keychain "${RUNNER_TEMP}/meerai-signing.keychain-db" || true
          fi

      - name: Package Unix archive and checksum
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.archive }}" -C "target/${{ matrix.target }}/release" "${BIN_NAME}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          else
            shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          fi

      - name: Sign Windows binary
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "windows-cert.pfx"
          $bin = "target/${{ matrix.target }}/release/${env:BIN_NAME}.exe"
          $timestampUrl = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) { "http://timestamp.digicert.com" } else { $env:WINDOWS_TIMESTAMP_URL }

          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) {
            throw "signtool.exe not found under Windows Kits 10"
          }

          try {
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            & $signtool sign /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr $timestampUrl /td SHA256 $bin
            if ($LASTEXITCODE -ne 0) {
              throw "signtool.exe exited with code $LASTEXITCODE"
            }
          } finally {
            Remove-Item -Force -ErrorAction SilentlyContinue $certPath
          }

      - name: Package Windows archive and checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $bin = "target/${{ matrix.target }}/release/${env:BIN_NAME}.exe"
          $archive = "dist/${{ matrix.archive }}"
          Compress-Archive -Force -Path $bin -DestinationPath $archive
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.archive }}" | Out-File -FilePath "$archive.sha256" -Encoding ascii -NoNewline

      - name: Upload target artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: [detect, build]
    if: needs.detect.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Build combined SHA256SUMS.txt
        run: |
          cd artifacts
          cat *.sha256 | sort -k2 > SHA256SUMS.txt
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.detect.outputs.tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          name: meerai ${{ needs.detect.outputs.tag }}
          prerelease: ${{ needs.detect.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            artifacts/meerai-*.tar.gz
            artifacts/meerai-*.zip
            artifacts/meerai-*.sha256
            artifacts/SHA256SUMS.txt
          body: |
            ## Install

            **macOS and Linux**
            ```sh
            curl -LsSf https://meerai.packvision.xyz/install.sh | sh
            ```

            **Windows (PowerShell)**
            ```powershell
            powershell -ExecutionPolicy ByPass -c "irm https://meerai.packvision.xyz/install.ps1 | iex"
            ```
