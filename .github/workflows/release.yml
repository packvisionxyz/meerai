name: Release

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
  && format('Release {0}', inputs.tag || 'from workspace version')
  || 'Release from version bump' }}

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag name (e.g. v0.1.0); omit to use the workspace version
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: meerai

jobs:
  detect:
    name: Detect release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.head_commit != null &&
      startsWith(github.event.head_commit.message, 'chore(release): bump version to '))
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      skip: ${{ steps.gate.outputs.skip }}
      release_sha: ${{ steps.commit.outputs.release_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve tag and check workspace version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          TAG_FROM_VERSION: ${{ inputs.tag == '' && '1' || '' }}
        run: python3 .github/scripts/verify_release_version.py

      - name: Require the bump commit message
        id: commit
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          subject="$(git log -1 --format=%s)"
          expected="chore(release): bump version to ${TAG#v}"
          suffix="${subject#"$expected"}"
          matched=false
          if [ "$suffix" = "" ] || printf '%s' "$suffix" | grep -Eq '^ \(#[0-9]+\)$'; then
            matched=true
          fi
          if [ "$matched" != "true" ]; then
            if [ "$EVENT" = "workflow_dispatch" ]; then
              echo "::warning::Manual dispatch on a commit whose subject is '$subject'."
            else
              echo "::error::Commit subject '$subject' does not match '$expected' or '$expected (#<pr>)'."
              echo "::error::Squash-merge the bump pull request with the PR title unchanged so the release starts."
              exit 1
            fi
          fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Release commit: $subject"

      - name: Require a pure version bump commit
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          EVENT: ${{ github.event_name }}
        run: python3 .github/scripts/verify_bump_commit.py

      - name: Skip when the version is already released
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          skip=false
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::notice::Release ${TAG} already exists; skipping."
            skip=true
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

  release-notes:
    name: Build release notes (${{ needs.detect.outputs.tag }})
    needs: detect
    if: needs.detect.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    outputs:
      previous_tag: ${{ steps.notes.outputs.previous_tag }}
      commit_count: ${{ steps.notes.outputs.commit_count }}
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.release_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Generate release body
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
          TAG: ${{ needs.detect.outputs.tag }}
          NOTES_OUT: release-notes.md
        run: python3 .github/scripts/generate_release_notes.py

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 1

  build:
    name: Build ${{ matrix.target }} (${{ needs.detect.outputs.tag }})
    needs: [detect, release-notes]
    if: needs.detect.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            archive: meerai-x86_64-unknown-linux-gnu.tar.gz
          - target: aarch64-apple-darwin
            os: macos-15
            archive: meerai-aarch64-apple-darwin.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: meerai-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.release_sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          targets: ${{ matrix.target }}

      - name: Cache Cargo artifacts
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Add the Wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Build the browser bundle
        shell: bash
        run: |
          set -euo pipefail
          python_command="$(command -v python3 || command -v python)"
          "$python_command" scripts/build-web.py

      - name: Build release binary with the web feature
        shell: bash
        run: cargo build --release --locked -p meerai-cli --features web --target "${{ matrix.target }}"

      - name: Sign macOS binary
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        shell: bash
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="${RUNNER_TEMP}/meerai-signing.keychain-db"
          CERT_PATH="${RUNNER_TEMP}/apple-cert.p12"
          KEYCHAIN_PASS="$(openssl rand -hex 24)"

          printf '%s' "${APPLE_CERTIFICATE}" | base64 --decode > "${CERT_PATH}"
          security create-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" -k "${KEYCHAIN_PATH}" -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" login.keychain-db

          IDENTITY="${APPLE_SIGNING_IDENTITY}"
          if [ -z "${IDENTITY}" ]; then
            IDENTITY="$(security find-identity -v -p codesigning "${KEYCHAIN_PATH}" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          fi
          if [ -z "${IDENTITY}" ]; then
            echo "::error::No Developer ID Application signing identity found in imported certificate"
            exit 1
          fi

          codesign --force --options runtime --timestamp --sign "${IDENTITY}" "target/${{ matrix.target }}/release/${BIN_NAME}"
          codesign --verify --verbose=2 "target/${{ matrix.target }}/release/${BIN_NAME}"
          rm -f "${CERT_PATH}"

      - name: Notarize macOS binary
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != ''
        shell: bash
        run: |
          set -euo pipefail
          NOTARIZE_ZIP="${RUNNER_TEMP}/${BIN_NAME}-notarize.zip"
          ditto -c -k --keepParent "target/${{ matrix.target }}/release/${BIN_NAME}" "${NOTARIZE_ZIP}"
          xcrun notarytool submit "${NOTARIZE_ZIP}" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_PASSWORD}" \
            --wait
          rm -f "${NOTARIZE_ZIP}"

      - name: Clean up macOS signing keychain
        if: always() && runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/apple-cert.p12" "${RUNNER_TEMP}/${BIN_NAME}-notarize.zip"
          if [ -f "${RUNNER_TEMP}/meerai-signing.keychain-db" ]; then
            security delete-keychain "${RUNNER_TEMP}/meerai-signing.keychain-db" || true
          fi

      - name: Package Unix archive and checksum
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.archive }}" -C "target/${{ matrix.target }}/release" "${BIN_NAME}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          else
            shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          fi

      - name: Sign Windows binary
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "windows-cert.pfx"
          $bin = "target/${{ matrix.target }}/release/${env:BIN_NAME}.exe"
          $timestampUrl = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) { "http://timestamp.digicert.com" } else { $env:WINDOWS_TIMESTAMP_URL }

          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) {
            throw "signtool.exe not found under Windows Kits 10"
          }

          try {
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            & $signtool sign /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr $timestampUrl /td SHA256 $bin
            if ($LASTEXITCODE -ne 0) {
              throw "signtool.exe exited with code $LASTEXITCODE"
            }
          } finally {
            Remove-Item -Force -ErrorAction SilentlyContinue $certPath
          }

      - name: Package Windows archive and checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $bin = "target/${{ matrix.target }}/release/${env:BIN_NAME}.exe"
          $archive = "dist/${{ matrix.archive }}"
          Compress-Archive -Force -Path $bin -DestinationPath $archive
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.archive }}" | Out-File -FilePath "$archive.sha256" -Encoding ascii -NoNewline

      - name: Upload target artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  publish:
    name: Publish ${{ needs.detect.outputs.tag }}
    needs: [detect, release-notes, build]
    if: needs.detect.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.release_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes

      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Build combined SHA256SUMS.txt
        run: |
          cd artifacts
          cat *.sha256 | sort -k2 > SHA256SUMS.txt
          ls -la

      - name: Create the tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
          PRERELEASE: ${{ needs.detect.outputs.prerelease }}
          RELEASE_SHA: ${{ needs.detect.outputs.release_sha }}
          PREVIOUS_TAG: ${{ needs.release-notes.outputs.previous_tag }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          if [ -n "$PREVIOUS_TAG" ]; then
            flags+=(--notes-start-tag "$PREVIOUS_TAG")
          fi
          gh release create "$TAG" \
            --target "$RELEASE_SHA" \
            --title "meerai $TAG" \
            --notes-file notes/release-notes.md \
            "${flags[@]}" \
            artifacts/meerai-*.tar.gz \
            artifacts/meerai-*.zip \
            artifacts/meerai-*.sha256 \
            artifacts/SHA256SUMS.txt
          echo "::notice::Published https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      - name: Summarize the release
        env:
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
          COMMITS: ${{ needs.release-notes.outputs.commit_count }}
        run: |
          {
            echo "## Released $TAG"
            echo ""
            echo "- Workspace version: \`$VERSION\`"
            echo "- Commits since ${{ needs.release-notes.outputs.previous_tag || 'the start of history' }}: $COMMITS"
            echo "- Artifacts: web-enabled TUI + browser companion (\`--features web\`)"
          } >> "$GITHUB_STEP_SUMMARY"
