[package]
name = "meerai-providers"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
meerai-client = { path = "../meerai-client/" }
meerai-common = { path = "../meerai-common/" }
meerai-core = { path = "../meerai-core/" }

anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
genai = { workspace = true }
getrandom = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true, features = ["form"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
meerai-store = { path = "../meerai-store/" }
rusqlite = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[dev-dependencies]
tempfile = "3"
