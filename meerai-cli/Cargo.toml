[package]
name = "meerai-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "meerai"
path = "src/main.rs"

[features]
default = ["tui"]
tui = ["dep:meerai-tui", "dep:meerai-host"]
web = ["dep:meerai-web", "dep:meerai-host"]

[dependencies]
meerai-acp = { path = "../meerai-acp/" }
meerai-agents = { path = "../meerai-agents/" }
meerai-client = { path = "../meerai-client/" }
meerai-common = { path = "../meerai-common/" }
meerai-core = { path = "../meerai-core/" }
meerai-host = { path = "../meerai-host/", optional = true }
meerai-policy = { path = "../meerai-policy/" }
meerai-providers = { path = "../meerai-providers/" }
meerai-session = { path = "../meerai-session/" }
meerai-store = { path = "../meerai-store/" }
meerai-tools = { path = "../meerai-tools/" }
meerai-tui = { path = "../meerai-tui/", optional = true }
meerai-web = { path = "../meerai-web/", optional = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
dotenvy = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
rusqlite = { workspace = true }
