[package]
name = "meerai-web-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
meerai-web-protocol = { path = "../meerai-web-protocol" }
leptos = { version = "0.8", features = ["csr"] }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
comrak = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlInputElement",
  "HtmlTextAreaElement", "HtmlDetailsElement", "KeyboardEvent", "MouseEvent",
  "DragEvent", "DataTransfer", "Event", "EventTarget", "DomRect", "NodeList",
  "Clipboard", "Navigator", "EventSource", "MessageEvent", "ErrorEvent",
  "Request", "RequestInit", "RequestCredentials", "Headers", "Response",
  "Location", "Storage", "MediaQueryList", "MediaQueryList",
] }
