[workspace]
members = ["meerai-*"]
resolver = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.100"
authors = ["Pack Vision Core Dev"]
description = "Pack Vision's AI agent harness"
license = "Apache-2.0"
repository = "https://github.com/packvisionxyz/meerai"
homepage = "https://meerai.packvision.xyz"
publish = false

[workspace.dependencies]
# AI / LLM
genai = "0.7"

# Async & Runtime
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# Error Handling
anyhow = "1"
thiserror = "2"

# Serialization & Schema
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
jsonwebtoken = { version = "12", default-features = false, features = [
  "aws_lc_rs",
] }

# Cryptography
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
subtle = "2.6"
chacha20poly1305 = "0.11"
zeroize = { version = "1.8", features = ["derive"] }
argon2 = "0.6"

# Embedded storage
rusqlite = { version = "0.43", features = ["bundled", "fallible_uint"] }

# HTTP server (loopback web companion)
http = "1.5"
http-body-util = "0.1"
hyper = { version = "1.12", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
mime_guess = "2.0"
tokio-stream = { version = "0.1", features = ["sync"] }

# Terminal UI
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = "0.30"
unicode-width = "0.2"

# Markdown
comrak = { version = "1", default-features = false }

# Updates
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
] }

# Utilities & Config
dotenvy = "0.15"
globset = "0.4"
git2 = { version = "0.21", default-features = false }
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
insta = "1.42"
lsp-types = "0.97"
regex = "1"
similar = "3"
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
zstd = "0.14"
