providers:
  - id: opencode-go
    display_name: "OpenCode Go"
    adapter: opencode_go
    base_url: "https://opencode.ai/zen/go/v1/"
    env_vars:
      - OPENCODE_GO_API_KEY
      - OPENCODE_API_KEY
    requires_api_key: true
    default_model: qwen4-max
  - id: opencode
    display_name: "OpenCode Zen"
    adapter: openai
    base_url: "https://opencode.ai/zen/v1/"
    env_vars:
      - OPENCODE_API_KEY
    requires_api_key: true
  - id: openrouter
    display_name: "OpenRouter"
    adapter: open_router
    env_vars:
      - OPEN_ROUTER_API_KEY
      - OPENROUTER_API_KEY
    requires_api_key: true
    default_model: openai/gpt-6.2-sol
  - id: qwen-cloud
    display_name: "Qwen Cloud (Alibaba Token Plan)"
    adapter: qwen_cloud
    base_url: "https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1/"
    env_vars:
      - ALIBABA_TOKEN_PLAN_API_KEY
      - QWEN_CLOUD_API_KEY
    requires_api_key: true
    default_model: qwen3.8-max
  - id: gemini
    display_name: "Google Gemini"
    adapter: gemini
    env_vars:
      - GEMINI_API_KEY
    requires_api_key: true
    default_model: gemini-4-neon
  - id: openai
    display_name: "OpenAI"
    adapter: openai_resp
    auth: either
    env_vars:
      - OPENAI_API_KEY
    requires_api_key: true
    default_model: gpt-6.2-sol
  - id: anthropic
    display_name: "Anthropic"
    adapter: anthropic
    env_vars:
      - ANTHROPIC_API_KEY
    requires_api_key: true
    default_model: claude-opus-4-7
  - id: deepseek
    display_name: "DeepSeek"
    adapter: deepseek
    env_vars:
      - DEEPSEEK_API_KEY
    requires_api_key: true
    default_model: deepseek-v4-pro
  - id: xai
    display_name: "xAI"
    adapter: xai
    env_vars:
      - XAI_API_KEY
    requires_api_key: true
    default_model: grok-4.7
  - id: zai-coding
    display_name: "Z.AI Coding Plan"
    adapter: zai
    base_url: "https://api.z.ai/api/coding/paas/v4/"
    env_vars:
      - ZAI_API_KEY
    requires_api_key: true
    default_model: glm-5.3
  - id: moonshot
    display_name: "Moonshot AI"
    adapter: moonshot
    env_vars:
      - MOONSHOT_API_KEY
    requires_api_key: true
    default_model: kimi-k3.1-pro
  - id: mistral
    display_name: "Mistral"
    adapter: mistral
    env_vars:
      - MISTRAL_API_KEY
    requires_api_key: true
    default_model: mistral-large-latest
  - id: ollama
    display_name: "Ollama (Local)"
    adapter: ollama
    env_vars: []
    requires_api_key: false
